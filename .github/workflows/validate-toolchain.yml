name: Validate toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - bugfix/SW_SS-655/toolchain-packaging
  pull_request:

permissions:
  contents: read

jobs:
  catalog-contract:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run catalog contract tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/Test-ToolchainCatalog.ps1
